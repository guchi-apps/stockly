name: CI

# 注意: claude-conflict-resolve.ymlが、このワークフローの`workflow_run`(CI / requested /
# develop)を「developへのpush」の代理通知として購読している(guchi-apps/issue-deck#1330。
# claude-code-actionがpushイベントに対応していないため直接pushで受けられない)。また
# claude-ci-fix.ymlが`workflow_run`(CI / completed)でCIの失敗を検知する。したがって
# - ワークフロー名(`CI`)
# - `push: branches: [develop]`トリガー
# - ジョブ名(`lint-and-build`。developとmainのbranch protectionの必須チェック)
# を変更・削除すると、それらが無言で止まる。変更する場合は両ワークフローとbranch
# protectionも合わせて直す。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 家庭の境界・許可メール・open redirect・開発用ログインの無効化を検証する
      # （Node標準の `node --test`。DBにも外部サービスにも接続しない）。
      - name: Unit test
        run: pnpm test:unit

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          # ビルドは外部サービスへ接続しない。値の形式だけが要るためプレースホルダーを渡す。
          # claude-ci-fix.yml / claude-pr-repair.yml の build-env と同じ値にする。
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_stockly
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      # 本番ビルドを実際に起動し、開発用ログイン（POST /api/dev/login）が閉じていること・
      # 未ログインが/loginへ戻ることをHTTPで確かめる（#13）。関数単位の単体テストでは
      # 配線の間違い（別経路の判定・NODE_ENVの固定漏れ）を見つけられないため。
      # 外部サービスには接続しない（スクリプトがビルド時と同じプレースホルダーを渡す）。
      - name: Production smoke (dev login disabled)
        run: bash scripts/check-dev-login-disabled.sh

  # 他家庭のデータを参照できないことを保証する複合外部キー（#3）が、コードの変更で
  # 静かに壊れていないことを実DB（MySQL）で検証する（#18）。lint-and-buildとは分けてあり、
  # ジョブが落ちてもlint-and-build自体は成功したままになる（branch protectionの必須チェックは
  # lint-and-buildのみのため）。無人修復ワークフロー（claude-ci-fix.yml / claude-pr-repair.yml）は
  # 実DBを持たないため、このジョブの失敗は対象外（CLAUDE.mdの「検証」を参照）。
  db-constraint-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: app_stockly
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/app_stockly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Seed sample data
        run: pnpm db:seed

      - name: DB constraint tests
        run: pnpm test:db

  notify:
    needs: [lint-and-build, db-constraint-tests]
    if: always()
    runs-on: ubuntu-latest

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SIGNALY_WEBHOOK_URLはorganizationの共通値。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          lint_and_build="${{ needs.lint-and-build.result }}"
          db_tests="${{ needs.db-constraint-tests.result }}"
          if [ "$lint_and_build" = "success" ] && [ "$db_tests" = "success" ]; then
            result=success
          elif [ "$lint_and_build" = "cancelled" ] || [ "$db_tests" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "success" ]; then
            echo "jobs=lint-and-build, db-constraint-tests" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=lint-and-build: $lint_and_build, db-constraint-tests: $db_tests" >> "$GITHUB_OUTPUT"
          fi
          # develop push: failure only. main PR: success, failure, and cancelled.
          if [ "$result" = "failure" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signaly に通知
        if: steps.status.outputs.should_notify == 'true'
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: stockly
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/signaly-notify.sh
