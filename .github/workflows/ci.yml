name: CI

# 注意: claude-conflict-resolve.ymlが、このワークフローの`workflow_run`(CI / requested /
# develop)を「developへのpush」の代理通知として購読している(guchi-apps/issue-deck#1330。
# claude-code-actionがpushイベントに対応していないため直接pushで受けられない)。また
# claude-ci-fix.ymlが`workflow_run`(CI / completed)でCIの失敗を検知する。したがって
# - ワークフロー名(`CI`)
# - `push: branches: [develop]`トリガー
# - ジョブ名(`lint-and-build`。developとmainのbranch protectionの必須チェック)
# を変更・削除すると、それらが無言で止まる。変更する場合は両ワークフローとbranch
# protectionも合わせて直す。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Node標準のテストランナーで src/**/*.test.ts を実行する（DBには接続しない）。
      - name: Unit test
        run: pnpm test:unit

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          # ビルドは外部サービスへ接続しない。値の形式だけが要るためプレースホルダーを渡す。
          # claude-ci-fix.yml / claude-pr-repair.yml の build-env と同じ値にする。
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_stockly
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  notify:
    needs: [lint-and-build]
    if: always()
    runs-on: ubuntu-latest

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SIGNALY_WEBHOOK_URLはorganizationの共通値。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          lint_and_build="${{ needs.lint-and-build.result }}"
          if [ "$lint_and_build" = "success" ]; then
            result=success
          elif [ "$lint_and_build" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$lint_and_build" = "success" ]; then
            echo "jobs=lint-and-build" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=lint-and-build: $lint_and_build" >> "$GITHUB_OUTPUT"
          fi
          # develop push: failure only. main PR: success, failure, and cancelled.
          if [ "$result" = "failure" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signaly に通知
        if: steps.status.outputs.should_notify == 'true'
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: stockly
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/signaly-notify.sh
