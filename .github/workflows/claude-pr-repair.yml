name: Claude PR Repair

# 対応Issueを持たないPull Request（バージョンバンプPR・develop→mainのリリースPR）が
# CI失敗またはコンフリクトで止まっているとき、Claude Codeによる自動修復を起動する
# ワークフローの、stockly側のトリガー定義（guchi-apps/issue-deck#1293）。
#
# **workflow_dispatchのみ**で、自動検知のトリガーは持たない。CI失敗・コンフリクトを検知して
# 自動で走る経路は claude-ci-fix.yml・claude-conflict-resolve.yml が持っており、そちらと
# 二重に走らせないため。起動元はissue-deckの画面の「CI失敗を自動修正」
# 「コンフリクトを自動解消」ボタン。
#
# 注意: workflow_dispatchの受け口はデフォルトブランチのワークフロー定義から解決されるため、
# このファイルがデフォルトブランチへ入るまでは起動できない。
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "対象のPull Request番号"
        required: true
        type: string
      mode:
        description: "修復の種類"
        required: true
        type: choice
        options:
          - ci
          - conflict

jobs:
  pr-repair:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-pr-repair.yml@workflows/v33
    with:
      runtime-setup: node-db
      package-manager: pnpm
      node-version: "24"
      # 再利用ワークフロー内のinputsコンテキストはworkflow_callのinputsを指すため、
      # 本ワークフローのworkflow_dispatch入力はここで明示的に渡す。
      pr-number: ${{ inputs.pr_number }}
      mode: ${{ inputs.mode }}
      verify-commands: "`pnpm lint`（Lint）・`pnpm typecheck`（型チェック）・`pnpm test:unit`（単体テスト）・`pnpm build:ci`（ビルド）・`bash scripts/check-dev-login-disabled.sh`（本番ビルドを起動して開発用ログインが無効なことを確かめるスモーク。ビルドの後に実行する）を実行し、問題がないことを確認する（.github/workflows/ci.ymlのlint-and-buildジョブと同じ5つ）。失敗したのが同じci.ymlのdb-constraint-testsジョブ（`pnpm test:db`。実MySQLへ接続する）の場合、このワークフローにはDBが無く`pnpm test:db`で修正結果を確認できない。ログから原因が明白なときだけ直し、確認できていない旨をコメントに明記する。原因に確信が持てなければ修復を断念して報告する"
      build-env: |
        DATABASE_URL=mysql://placeholder:placeholder@127.0.0.1:3306/app_stockly
        NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
      prompts-ref: workflows/v33
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
