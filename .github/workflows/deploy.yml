name: Deploy to Production

# mainへのpushでVPSへ配る（Apache → 127.0.0.1:3116 → PM2プロセス `stockly`）。
# research-deskのdeploy.ymlを土台にしており、ポート・プロセス名・公開URL以外は同じ形にしてある。
#
# **version-tag-check.ymlがこのファイルのtagジョブを前提にしている。** main宛PRの時点で
# package.jsonのversionに対応するタグが無いことを確かめており、ここでのタグ作成が唯一の
# タグ発行経路。ジョブを消すとリリースタグとGitHub Releaseが作られなくなる。
#
# **運用終了のため本番デプロイを止めている（#158）。** 起動できるトリガーを外し`workflow_call`だけを
# 残す。`push: main`だけを外すとissue-deckがイベント配送漏れとみなして`workflow_dispatch`で起動し直し、
# ファイルごと消すとその再起動が422で静かに畳まれる経路から外れるため、この形にする
# （guchi-apps/issue-deck の docs/app-shutdown.md「本番デプロイを止める」）。撤去手順は docs/decommission.md。
on:
  workflow_call:

concurrency:
  group: deploy-stockly-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・SUPABASE_*
    # はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      # Notion買い物リスト連携（#6）。未設定でもデプロイは通り、補充の送信だけができなくなる。
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_SHOPPING_DATABASE_ID: ${{ secrets.NOTION_SHOPPING_DATABASE_ID }}
      # 写真からの登録候補（#10）。未設定でもデプロイは通り、写真からの読み取りだけができなくなる。
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          # NEXT_PUBLIC_* はビルド時にバンドルへ埋め込まれるため、ここにも渡す。
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # VPS側の処理はgateが行うため、以前SSH先で使っていたscripts/construct-database-url.sh・
      # scripts/update-env-file.shは配らない（guchi-apps/issue-deck#4759）。
      # **`prisma.config.ts`は入れない。** あれは`dotenv`（devDependencies）をimportするが、
      # VPS側は`pnpm install --prod`なので入らず、`postinstall`の`prisma generate`が
      # モジュール解決に失敗する。`schema`・`migrations.path`は既定と同じ値なので、
      # 無くても`prisma generate`と`migrate deploy`は同じ場所を見る。
      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            pnpm-lock.yaml \
            public \
            .next \
            prisma \
            deploy \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・SUPABASE_*
    # はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      # Notion買い物リスト連携（#6）。未設定でもデプロイは通り、補充の送信だけができなくなる。
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_SHOPPING_DATABASE_ID: ${{ secrets.NOTION_SHOPPING_DATABASE_ID }}
      # 写真からの登録候補（#10）。未設定でもデプロイは通り、写真からの読み取りだけができなくなる。
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#301）へ渡す**
      # （guchi-apps/issue-deck#4759）。鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=が
      # gateのアプリ名（stockly。置き場の/home/github-user/apps/stocklyとpm2のプロセス名に一致する）
      # を固定する。任意のシェルコマンドは実行できず、upload・env・deployの3語だけが通る。
      # 旧配布物の削除（next.config.tsを含む）・展開・.env更新・pnpm install --prod・
      # prisma migrate deploy（MIGRATE_DATABASE_URLは.envへ書かずここだけで使う）・pm2の再起動・
      # 稼働版の照合（.envのAPP_COMMIT_SHAと/api/app-versionのsha。#151）はgate側が行う。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: Send environment variables
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          # 稼働している版の照合に使う（#151）。gateがPM2の起動前に.envへ書き、起動後に
          # 127.0.0.1:3116/api/app-versionのshaと一致するまで待つ（不一致なら失敗）。コミットのSHAは公開情報
          APP_COMMIT_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_GOOGLE_EMAILS: ${{ env.ALLOWED_GOOGLE_EMAILS }}
          NOTION_API_TOKEN: ${{ env.NOTION_API_TOKEN }}
          NOTION_SHOPPING_DATABASE_ID: ${{ env.NOTION_SHOPPING_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # マイグレーション専用ユーザー（DDL権限あり）が未設定なら、通常ユーザーで流す
          # （construct-database-url.shはMIGRATE_DB_*が揃ったときだけMIGRATE_DATABASE_URLを作る）。
          MIGRATE_DATABASE_URL="${MIGRATE_DATABASE_URL:-$DATABASE_URL}"
          # Notion・Anthropicのsecretはまだ登録されていないことがある。空のまま送れば、アプリ側は
          # 「未設定」として補充の送信（#6）・写真からの読み取り（#10）だけを止める。
          NOTION_API_TOKEN="${NOTION_API_TOKEN:-}"
          NOTION_SHOPPING_DATABASE_ID="${NOTION_SHOPPING_DATABASE_ID:-}"
          ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}"
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない。
          for name in APP_COMMIT_SHA DATABASE_URL MIGRATE_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALLOWED_GOOGLE_EMAILS NOTION_API_TOKEN \
            NOTION_SHOPPING_DATABASE_ID ANTHROPIC_API_KEY; do
            case "${!name}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ
          # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」）。
          # .envへ書くキーを足したら、ここにも並べる（gateは送られたキーだけを更新する）。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=3116"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            printf '%s\n' "ALLOWED_GOOGLE_EMAILS=${ALLOWED_GOOGLE_EMAILS}"
            printf '%s\n' "NOTION_API_TOKEN=${NOTION_API_TOKEN}"
            printf '%s\n' "NOTION_SHOPPING_DATABASE_ID=${NOTION_SHOPPING_DATABASE_ID}"
            printf '%s\n' "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

      # **deployジョブの成功は公開できたことを保証しない**（guchi-apps/issue-deck#2252）。
      # 上のヘルスチェックが叩くのはVPS内の127.0.0.1で、ApacheのVirtualHostが無くても通る。
      # ここで公開URLを外から引き、DNS・Apache・TLSまで通っているかを確かめる。
      #
      # **失敗させない。** certbot前・DNS未反映の初回デプロイは必ず落ちるため、
      # 警告として出すだけにする（初回だけの分岐も持たない。2回目以降もApacheの設定や
      # プロセスが壊れていれば拾えるほうがよい）。
      - name: 公開URLの疎通を確認する（警告のみ）
        continue-on-error: true
        run: |
          URL="https://stockly.gucchii.com/"
          # 失敗時もcurl自身が %{http_code} に 000 を出す。パイプで 000 を足すと
          # 2行になって数値比較が壊れるので、終了コードだけを握りつぶす
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 20 "$URL") || true
          [ -n "$CODE" ] || CODE=000
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
            echo "$URL -> $CODE"
          else
            echo "::warning::$URL が開けませんでした（HTTP $CODE）。デプロイ自体は成功しています。DNSのAレコード・ApacheのVirtualHost・TLS証明書を確認してください。"
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()

    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: stockly
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          # リリースだけはCI・デプロイと別のチャンネルへ送る（guchi-apps/issue-deck#2391）。
          # 未登録なら空が渡り、スクリプトが従来のチャンネルへフォールバックする。
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: stockly
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
